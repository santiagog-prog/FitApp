<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitApp — Entrenador y Alumno</title>
<link rel="manifest" href="manifest.json?v=20260617e">
<meta name="theme-color" content="#E8F500">
<link rel="stylesheet" href="styles/global.css?v=20260617e">
<style>
  body{ display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; background: var(--bg-base); }
  .gate{ max-width:380px; width:100%; }
  .gate .logo-box{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:40px; }
  .gate .logo-mark{ width:36px; height:36px; background:var(--accent); border-radius:10px; display:flex; align-items:center; justify-content:center; }
  .gate h1{ font-weight:800; font-size:22px; letter-spacing:-.5px; color:var(--text-primary); }
  .gate p.sub{ text-align:center; color: var(--text-tertiary); margin-bottom:28px; font-size:.9rem; }
  .role-card{ background: var(--bg-card); border-radius:20px; padding:24px; margin-bottom:16px; }
  .role-card .icon{ width:42px; height:42px; border-radius:12px; background: var(--accent-light); display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .role-card .icon svg{ width:22px; height:22px; stroke: var(--accent); stroke-width:1.5; fill:none; }
  .role-card h2{ font-size:1.1rem; font-weight:700; margin-bottom:4px; color: var(--text-primary); }
  .role-card p{ font-size:.85rem; color: var(--text-tertiary); margin-bottom:16px; }
  .codigo-row{ display:flex; gap:8px; margin-bottom:14px; justify-content:center; }
  .codigo-row input{ width:64px; height:70px; border-radius:12px; border:1.5px solid var(--separator); background: var(--bg-card-2); color:var(--text-primary); font-size:32px; text-align:center; font-family:var(--font-data); }
  .codigo-row input:focus{ outline:none; border-color: var(--accent); }
  .error-msg{ color: var(--error); font-size:.8rem; margin-bottom:10px; display:none; }
  .continuar{ background: var(--bg-card); border-radius:50px; padding:14px; text-align:center; margin-bottom:16px; font-weight:700; color: var(--accent); cursor:pointer; }
</style>
</head>
<body>
<div class="gate">
  <div class="logo-box">
    <div class="logo-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2.5" stroke-linecap="round"><path d="M6 4v16M18 4v16M6 12h12M2 7h4M18 7h4M2 17h4M18 17h4"/></svg></div>
    <h1>FitApp</h1>
  </div>
  <p class="sub">Tu mejor versión empieza hoy.</p>

  <div class="continuar" id="continuar-sesion" style="display:none;"></div>

  <div class="role-card">
    <div class="icon"><svg viewBox="0 0 24 24" stroke-width="1.5" fill="none"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg></div>
    <h2>Soy entrenador</h2>
    <p>Crea rutinas, planes de alimentación y sigue a tus alumnos.</p>
    <button class="pill-btn" id="btn-coach">Entrar al panel</button>
  </div>

  <div class="role-card">
    <div class="icon"><svg viewBox="0 0 24 24" stroke-width="1.5" fill="none"><circle cx="12" cy="7" r="3"/><path d="M5 21c0-4 3-7 7-7s7 3 7 7"/></svg></div>
    <h2>Soy alumno</h2>
    <p>Ingresa tu código de 4 dígitos para ver tu rutina y plan.</p>
    <div class="codigo-row">
      <input type="tel" maxlength="1" class="codigo-digito" inputmode="numeric">
      <input type="tel" maxlength="1" class="codigo-digito" inputmode="numeric">
      <input type="tel" maxlength="1" class="codigo-digito" inputmode="numeric">
      <input type="tel" maxlength="1" class="codigo-digito" inputmode="numeric">
    </div>
    <input type="hidden" id="codigo-alumno">
    <p class="error-msg" id="error-codigo">Código incorrecto, contacta a tu entrenador.</p>
    <button class="pill-btn" id="btn-alumno">Entrar</button>
    <p style="text-align:center;margin-top:10px;font-size:.78rem;color:var(--text-tertiary);">Demo: prueba con el código 1111</p>
  </div>
</div>

<script src="js/db.js?v=20260617e"></script>
<script>
(function(){
  "use strict";
  function safe(fn){ try{ fn(); }catch(e){ console.error(e); } }

  safe(function(){
    var actualId = window.db.getAlumnoActual();
    if(actualId){
      var a = window.db.getAlumnoPorId(actualId);
      if(a){
        var box = document.getElementById("continuar-sesion");
        box.style.display = "block";
        box.textContent = "Continuar como " + a.nombre;
        box.addEventListener("click", function(){ location.href = "alumno/index.html"; });
      }
    }
  });

  safe(function(){
    document.getElementById("btn-coach").addEventListener("click", function(){
      location.href = "coach/index.html";
    });
  });

  safe(function(){
    var digitos = document.querySelectorAll(".codigo-digito");
    digitos.forEach(function(inp, i){
      inp.addEventListener("input", function(){
        this.value = this.value.replace(/[^0-9]/g,"").slice(0,1);
        if(this.value && digitos[i+1]) digitos[i+1].focus();
        document.getElementById("codigo-alumno").value = Array.from(digitos).map(function(d){ return d.value; }).join("");
      });
      inp.addEventListener("keydown", function(e){
        if(e.key === "Backspace" && !this.value && digitos[i-1]) digitos[i-1].focus();
      });
    });
  });

  safe(function(){
    document.getElementById("btn-alumno").addEventListener("click", function(){
      var codigo = document.getElementById("codigo-alumno").value.trim();
      var a = window.db.getAlumnoPorCodigo(codigo);
      var err = document.getElementById("error-codigo");
      if(a){
        window.db.setAlumnoActual(a.id);
        location.href = "alumno/index.html";
      } else {
        err.style.display = "block";
      }
    });
  });
})();
</script>
</body>
</html>
